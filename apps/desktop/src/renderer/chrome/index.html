<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'none'">
  <title>Nude</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <div id="app">
    <!-- Row 1: tabs (the window's drag area) -->
    <header id="titlebar">
      <div id="tabstrip" role="tablist" aria-label="Tabs"></div>
      <button id="new-tab" class="icon-btn small" title="New tab (Ctrl+T)" aria-label="New tab"></button>
      <div class="drag-space"></div>
    </header>

    <!-- Row 2: navigation, the address bar, and a few actions -->
    <nav id="toolbar" aria-label="Navigation">
      <div class="nav-group">
        <button id="back" class="icon-btn" title="Back (Alt+Left)" aria-label="Back"></button>
        <button id="forward" class="icon-btn" title="Forward (Alt+Right)" aria-label="Forward"></button>
        <button id="reload" class="icon-btn" title="Reload (Ctrl+R)" aria-label="Reload"></button>
      </div>

      <div id="omnibox" class="omnibox">
        <button id="site-info" class="site-info" aria-label="Rovian Defender: site security"></button>
        <input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Search or enter address" placeholder="Search or enter address">
        <button id="reader" class="icon-btn tiny" title="Reader view" aria-label="Reader view" hidden></button>
        <button id="star" class="icon-btn tiny" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page"></button>
        <span id="progress" class="progress" aria-hidden="true"></span>
      </div>

      <div id="actions">
        <button id="bookmarks" class="icon-btn" title="Bookmarks" aria-label="Bookmarks"></button>
        <button id="tabs-btn" class="icon-btn tabs-btn" title="All tabs (Ctrl+Shift+Space)" aria-label="All tabs"><span class="count"></span></button>
        <button id="downloads" class="icon-btn" title="Downloads (Ctrl+J)" aria-label="Downloads"><svg class="ring" viewBox="0 0 36 36" hidden><circle cx="18" cy="18" r="15"/></svg><span class="dot" hidden></span></button>
        <button id="ai-btn" class="nebula-btn" title="Nebula (Ctrl+Shift+A)" aria-label="Nebula"><span class="orb"></span></button>
        <button id="menu" class="icon-btn" title="Menu" aria-label="Menu"></button>
      </div>
    </nav>

    <div id="bookmarks-bar" aria-label="Bookmarks" hidden></div>
    <div id="bars"></div>

    <main id="main">
      <div id="content">
        <div id="content-inner">
          <img id="snapshot" alt="" hidden>
          <div id="page-state" hidden></div>
        </div>
      </div>
    </main>

    <div id="overlay" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="chrome.js"></script>
</body>
</html>
