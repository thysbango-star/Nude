<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'none'">
  <title>Nude</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <button id="home" class="icon-btn" title="Home" aria-label="Home"></button>
      <button id="mode" class="mode-chip" title="Browsing mode" aria-haspopup="menu"></button>
      <div id="tabstrip" role="tablist" aria-label="Tabs"></div>
      <button id="new-tab" class="icon-btn" title="New tab (Ctrl+T)" aria-label="New tab"></button>
      <div class="drag-space"></div>
      <button id="tab-list" class="icon-btn" title="All tabs" aria-label="All tabs"></button>
    </header>

    <div id="frame">
      <nav id="toolbar" aria-label="Navigation">
        <button id="back" class="icon-btn" title="Back (Alt+Left)" aria-label="Back"></button>
        <button id="forward" class="icon-btn" title="Forward (Alt+Right)" aria-label="Forward"></button>
        <button id="reload" class="icon-btn" title="Reload (Ctrl+R)" aria-label="Reload"></button>
        <button id="shield" class="icon-btn shield" title="Rovian Defender" aria-label="Rovian Defender"><span class="badge" hidden></span></button>

        <div id="omnibox" class="omnibox">
          <button id="site-info" class="site-info" aria-label="Site information"></button>
          <input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Search or enter address" placeholder="Search or enter address">
          <button id="reader" class="icon-btn small" title="Reader view" aria-label="Reader view" hidden></button>
          <button id="star" class="icon-btn small" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page"></button>
          <button id="site-controls" class="icon-btn small" title="Site controls" aria-label="Site controls"></button>
        </div>

        <div id="actions">
          <button id="split" class="icon-btn" title="Split view" aria-label="Split view"></button>
          <button id="overview" class="icon-btn" title="Tab overview" aria-label="Tab overview"></button>
          <button id="downloads" class="icon-btn" title="Downloads (Ctrl+J)" aria-label="Downloads"><svg class="ring" viewBox="0 0 36 36" hidden><circle cx="18" cy="18" r="15"/></svg><span class="dot" hidden></span></button>
          <div id="theme" class="theme-toggle" role="group" aria-label="Theme">
            <button data-theme="light" aria-label="Light theme"></button>
            <button data-theme="dark" aria-label="Dark theme"></button>
          </div>
          <button id="avatar" class="avatar" title="Account" aria-label="Account"></button>
          <button id="menu" class="icon-btn" title="Menu" aria-label="Menu"></button>
          <span class="divider" aria-hidden="true"></span>
          <button id="ai-btn" class="ai-btn" title="Nebula (Ctrl+Shift+A)" aria-label="Nebula"></button>
        </div>
      </nav>

      <div id="bookmarks-bar" aria-label="Bookmarks"></div>
      <div id="bars"></div>

      <main id="main">
        <div id="content">
          <div id="content-inner">
            <img id="snapshot" alt="" hidden>
            <div id="split-handle" hidden></div>
            <div id="page-state" hidden></div>
          </div>
        </div>
        <aside id="ai-panel" hidden aria-label="Nebula"></aside>
      </main>
    </div>

    <div id="overlay" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="chrome.js"></script>
</body>
</html>
