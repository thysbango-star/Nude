name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck -w apps/desktop
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build -w apps/desktop
      - name: Browser end-to-end tests
        run: xvfb-run -a npm run test:e2e -w apps/desktop
      - name: Services tests
        run: |
          for s in services/*/; do
            if [ -f "$s/package.json" ]; then (cd "$s" && npm test); fi
          done

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build -w apps/desktop
        env: { NODE_ENV: production }
      - name: Package (NSIS installer + portable zip)
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: nude-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Unit tests
        working-directory: apps/android
        run: gradle testDebugUnitTest --stacktrace
      - name: Build APK
        working-directory: apps/android
        run: gradle assembleRelease --stacktrace
        env:
          NUDE_KEYSTORE_BASE64: ${{ secrets.NUDE_KEYSTORE_BASE64 }}
          NUDE_KEYSTORE_PASSWORD: ${{ secrets.NUDE_KEYSTORE_PASSWORD }}
          NUDE_KEY_ALIAS: ${{ secrets.NUDE_KEY_ALIAS }}
          NUDE_KEY_PASSWORD: ${{ secrets.NUDE_KEY_PASSWORD }}
      - name: Collect APK
        run: |
          mkdir -p out
          cp apps/android/app/build/outputs/apk/release/*.apk out/Nude-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: nude-android, path: out/Nude-Android.apk, if-no-files-found: error }

  macos:
    name: macOS app
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build -w apps/desktop
        env: { NODE_ENV: production }
      - name: Package universal app (Apple silicon + Intel)
        working-directory: apps/desktop
        run: npx electron-builder --mac dir --universal --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Ad-hoc sign and make .dmg
        run: |
          APP=$(find apps/desktop/release -maxdepth 2 -name 'Nude.app' -type d | head -1)
          echo "Packaging $APP"
          codesign --force --deep --sign - "$APP"
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          mkdir -p dmg out && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Nude" -srcfolder dmg -ov -format UDZO "out/Nude-$VERSION-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: nude-macos, path: out/*.dmg, if-no-files-found: error }

  ios:
    name: iPhone & iPad app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: apps/ios
        run: brew install xcodegen && xcodegen generate
      - name: Unit tests (iOS Simulator)
        working-directory: apps/ios
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          echo "$UDID" > /tmp/udid
          xcodebuild test -project Nude.xcodeproj -scheme Nude -destination "id=$UDID" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual -quiet
      - name: Launch the app in the simulator (smoke test)
        working-directory: apps/ios
        run: |
          UDID=$(cat /tmp/udid)
          xcodebuild build -project Nude.xcodeproj -scheme Nude -configuration Debug -sdk iphonesimulator -destination "id=$UDID" \
            -derivedDataPath simbuild CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual -quiet
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" simbuild/Build/Products/Debug-iphonesimulator/Nude.app
          xcrun simctl launch "$UDID" os.nude.browser
          sleep 20
          if xcrun simctl spawn "$UDID" launchctl list | grep -q os.nude.browser; then
            echo "Nude is running in the simulator"
          else
            echo "Nude is not running — crash reports:"
            find ~/Library/Logs/DiagnosticReports -name 'Nude*' -mmin -10 -exec sh -c 'echo "== $1"; head -120 "$1"' _ {} \;
            exit 1
          fi
          xcrun simctl io "$UDID" screenshot ../../out-sim.png || true
      - name: Build unsigned .ipa (for sideloading / re-signing)
        working-directory: apps/ios
        run: |
          xcodebuild build -project Nude.xcodeproj -scheme Nude -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          mkdir -p Payload ../../out
          cp -R build/Build/Products/Release-iphoneos/Nude.app Payload/
          zip -qry ../../out/Nude-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: nude-ios, path: out/Nude-iOS-unsigned.ipa, if-no-files-found: error }

  release:
    name: Publish downloads
    # Publishes (or updates) the GitHub Release for the version in apps/desktop/package.json
    # on every push to main, and on version tags.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, android, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nude ${{ steps.v.outputs.version }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            ## Download Nude ${{ steps.v.outputs.version }}

            **Windows 10/11 (64-bit)**
            - `Nude-Setup-${{ steps.v.outputs.version }}-x64.exe` — installer (recommended)
            - `Nude-${{ steps.v.outputs.version }}-Windows-x64.zip` — portable, no install: unzip and run `Nude.exe`

            This build isn't code-signed yet, so Windows SmartScreen may show "Windows protected your PC". Click **More info → Run anyway**.

            **Mac (macOS 12+, Apple silicon and Intel)**
            - `Nude-${{ steps.v.outputs.version }}-macOS.dmg` — open it and drag Nude to Applications. It isn't notarised yet: the first time, right-click Nude → **Open** (or System Settings → Privacy & Security → **Open Anyway**). If macOS says it's "damaged", run `xattr -cr /Applications/Nude.app` in Terminal.

            **Android 10+**
            - `Nude-Android.apk` — open it on your phone and allow installing from your browser or Files app when asked.

            **iPhone & iPad (iOS/iPadOS 16+)**
            - `Nude-iOS-unsigned.ipa` — Apple doesn't allow installing apps directly. Sideload it with [Sideloadly](https://sideloadly.io) or [AltStore](https://altstore.io) using your Apple ID (free Apple IDs must re-sign every 7 days), or distribute through TestFlight with an Apple Developer account.

            Built from commit ${{ github.sha }}.
